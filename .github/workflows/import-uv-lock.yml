name: import-uv-lock

on:
  push:
    branches: [cursor/the-wip-tally-engine-75e9]
    paths:
      - ".github/workflows/import-uv-lock.yml"

permissions:
  contents: write

concurrency:
  group: import-uv-lock
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cursor/the-wip-tally-engine-75e9
      - name: fetch exact uv.lock
        run: |
          set -euo pipefail
          curl -fsSL -A "Mozilla/5.0" -o uv.lock "https://litter.catbox.moe/i0hmkl.lock"
          echo "6e454b283025b3826d7b7aaa114c4d4a6c5627977679f5bd1e505f5b4d7cc513  uv.lock" | sha256sum -c -
      - name: commit lock and remove importer
        run: |
          set -euo pipefail
          git config user.name "Ryan Duguid"
          git config user.email "ryan@duguid.com.au"
          git add uv.lock
          git rm --ignore-unmatch .github/workflows/import-uv-lock.yml
          git commit -m "Add uv.lock for reproducible installs"
          git push origin HEAD:cursor/the-wip-tally-engine-75e9
